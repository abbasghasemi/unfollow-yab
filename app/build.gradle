apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'io.michaelrocks.paranoid'

android {

    compileSdk 34
    buildToolsVersion "33.0.0"

    defaultConfig {
        applicationId "ghasemi.abbas.unfollowyab"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 39
        versionName "3.9"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        signingConfigs {
            debug {
                storeFile file("../key.jks")
                storePassword 'dsS548*--w42&6@3=j'
                keyAlias "Unfollowyab"
                keyPassword 'dsS548*--w42&6@3=j'
            }
        }
    }

    flavorDimensions "store"
    productFlavors {
        cafebazaar {
            manifestPlaceholders = [marketApplicationId: "com.farsitel.bazaar",
                                    marketBindAddress  : "ir.cafebazaar.pardakht.InAppBillingService.BIND",
                                    marketPermission   : "com.farsitel.bazaar.permission.PAY_THROUGH_BAZAAR"]
        }

        myket {
            manifestPlaceholders = [marketApplicationId: "ir.mservices.market",
                                marketBindAddress  : "ir.mservices.market.InAppBillingService.BIND",
                                marketPermission   : "ir.mservices.market.BILLING"]
        }
    }
}

allprojects {
    repositories {
        maven { url 'https://jitpack.io' }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.core:core-ktx:1.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'im.dacer:AndroidCharts:1.0.4'
    implementation 'ru.tinkoff.scrollingpagerindicator:scrollingpagerindicator:1.2.5'
    implementation 'androidx.viewpager2:viewpager2:1.1.0-beta02' // added for scrollingpagerindicator
    implementation 'io.github.ShawnLin013:number-picker:2.4.13'
    implementation "com.github.farasource:billing-client:1.0.1"
    implementation "com.github.farasource:waiting-bar:0.1-beta01"
    implementation "com.github.farasource:material-button:1.1.1"
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.0"))

    implementation platform('com.google.firebase:firebase-bom:31.0.1')
    implementation 'com.google.firebase:firebase-crashlytics:18.4.3'
    implementation 'com.google.firebase:firebase-analytics:21.3.0'
    implementation 'com.google.firebase:firebase-core:21.1.1'
    implementation 'com.google.firebase:firebase-messaging:23.2.1'

    implementation 'io.reactivex.rxjava2:rxjava:2.2.10'
    implementation 'io.reactivex.rxjava2:rxandroid:2.0.1'
}